name: T Driver
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "probe $(date -u +%s)" > probe.txt
          git add probe.txt
          git commit -m "probe: gated run test"
          git push -f origin HEAD:refs/heads/t-probe
          gh pr create --base main --head t-probe --title "T probe" --body "probe" || true
          rid=''
          for _ in $(seq 20); do
            rid=$(gh run list --workflow t-ci.yml --event pull_request --limit 10 --json databaseId,headBranch --jq 'first(.[] | select(.headBranch=="t-probe")) | .databaseId')
            [ -n "$rid" ] && break
            sleep 10
          done
          echo "pr-run-id=$rid"
          gh run list --workflow t-ci.yml --event pull_request --limit 5 --json databaseId,status,conclusion,headBranch --jq '.[] | [.databaseId,.status,.conclusion,.headBranch] | @tsv'
          if gh api -X POST "repos/$GH_REPO/actions/runs/$rid/approve"; then echo "APPROVE: ok"; else echo "APPROVE: failed"; fi
          sleep 30
          gh run view "$rid" --json status,conclusion --jq '[.status,.conclusion]|@tsv'
